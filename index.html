<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Coding Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    background: #f7f6f3;
  }
  h1 { font-size: 1.25rem; margin: 8px 0 16px; }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
    min-height: 300px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 90%;
    line-height: 1.45;
  }
  .msg p { margin: 0 0 8px; white-space: pre-wrap; }
  .msg p:last-child { margin-bottom: 0; }
  .user { align-self: flex-end; background: #dbeafe; }
  .assistant { align-self: flex-start; background: #ffffff; border: 1px solid #e5e5e5; }

  .code-block {
    position: relative;
    background: #1e1e2e;
    color: #e5e5e5;
    border-radius: 8px;
    margin: 8px 0;
    overflow-x: auto;
  }
  .code-block .lang {
    font-size: 0.7rem;
    color: #9ca3af;
    padding: 6px 10px 0;
    display: block;
  }
  .code-block pre {
    margin: 0;
    padding: 10px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.85rem;
    white-space: pre;
    overflow-x: auto;
  }
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #374151;
    color: #e5e5e5;
    border: none;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .copy-btn:hover { background: #4b5563; }

  form { display: flex; gap: 8px; position: sticky; bottom: 0; background: #f7f6f3; padding-top: 8px; }
  input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  button[type="submit"] {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #1d4ed8;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<h1>My Coding Assistant</h1>
<div id="chat"></div>

<form id="chat-form">
  <input id="input" type="text" placeholder="Ask for some code..." autocomplete="off" />
  <button type="submit" id="send-btn">Send</button>
</form>

<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");

  const history = [];

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Turns text with ```lang ... ``` fences into HTML with copy buttons.
  function renderContent(text) {
    const container = document.createElement("div");
    const parts = text.split(/```(\w*)\n?([\s\S]*?)```/g);
    // parts alternates: [plain, lang, code, plain, lang, code, ...]
    for (let i = 0; i < parts.length; i++) {
      if (i % 3 === 0) {
        if (parts[i].trim()) {
          const p = document.createElement("p");
          p.textContent = parts[i].trim();
          container.appendChild(p);
        }
      } else if (i % 3 === 1) {
        const lang = parts[i] || "code";
        const code = parts[i + 1] || "";
        const block = document.createElement("div");
        block.className = "code-block";
        const langLabel = document.createElement("span");
        langLabel.className = "lang";
        langLabel.textContent = lang;
        const pre = document.createElement("pre");
        pre.textContent = code.trim();
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "Copy";
        btn.onclick = () => {
          navigator.clipboard.writeText(code.trim());
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 1200);
        };
        block.appendChild(btn);
        block.appendChild(langLabel);
        block.appendChild(pre);
        container.appendChild(block);
        i++; // skip the code part we already consumed
      }
    }
    return container;
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.appendChild(renderContent(text));
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    inputEl.value = "";
    sendBtn.disabled = true;

    const loadingDiv = addMessage("assistant", "…");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingDiv.innerHTML = "";
        loadingDiv.appendChild(renderContent("Error: " + (data.error || "request failed")));
      } else {
        loadingDiv.innerHTML = "";
        loadingDiv.appendChild(renderContent(data.reply));
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      loadingDiv.innerHTML = "";
      loadingDiv.appendChild(renderContent("Network error — is the server running?"));
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });
</script>

</body>
</html>
